{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — CALLISTA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap">
  {% tailwind_css %}
</head>
<body class="h-full flex items-center justify-center" style="background-color:#F0F4F8;">

  <div class="w-full max-w-sm">

    <!-- Logo -->
    <div class="flex flex-col items-center gap-3 mb-8">
      <div class="w-12 h-12 rounded-xl flex items-center justify-center"
           style="background-color:#071D41;">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="#FFCD07">
          <path d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold" style="font-family:'Playfair Display',serif; color:#071D41;">
        Callista
      </h1>
      <p class="text-sm" style="color:#5C6670;">Sistema de Gestão de Pesquisa Legislativa</p>
    </div>

    <!-- Card de login -->
    <div class="rounded-xl p-6" style="background-color:#FFFFFF; border:1px solid #DBE8FB; box-shadow:0 4px 12px rgba(7,29,65,0.1);">

      {% if form.errors %}
      <div class="mb-4 rounded-lg px-4 py-3 text-sm"
           style="background-color:#FFF1F2; border:1px solid #FECDD3; color:#9F1239;">
        Usuário ou senha incorretos.
      </div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="flex flex-col gap-4">
          <div>
            <label class="form-label" for="id_username">Usuário</label>
            <input type="text" name="username" id="id_username"
                   class="form-input" autocomplete="username" autofocus required>
          </div>
          <div>
            <label class="form-label" for="id_password">Senha</label>
            <input type="password" name="password" id="id_password"
                   class="form-input" autocomplete="current-password" required>
          </div>
          <button type="submit"
                  class="w-full py-2 rounded-md text-sm font-semibold transition-colors"
                  style="background-color:#1351B4; color:white;">
            Entrar
          </button>
        </div>
      </form>
    </div>

  </div>

</body>
</html>
