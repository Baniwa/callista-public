{% load static tailwind_tags %}
<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}CALLISTA{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@300;400;500;600&display=swap">
  {% tailwind_css %}
  <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
</head>
<body class="h-full flex" style="background-color:#F0F4F8; color:#333333;">

  {% include "partials/sidebar.html" %}

  <main class="flex-1 flex flex-col min-h-screen overflow-auto">
    <header class="px-8 py-5 border-b flex items-center justify-between"
            style="border-color:#DBE8FB; background-color:#FFFFFF; box-shadow:0 1px 4px rgba(7,29,65,0.07);">
      <h1 class="text-lg font-semibold" style="color:#071D41;">{% block page_title %}{% endblock %}</h1>
      <div class="text-sm" style="color:#5C6670;">
        {% if user.is_authenticated %}{{ user.get_full_name|default:user.username }}{% endif %}
      </div>
    </header>

    <div class="flex-1 p-8">
      {% block content %}{% endblock %}
    </div>
  </main>

</body>
</html>
