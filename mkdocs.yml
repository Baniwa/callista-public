site_name: CALLISTA — Documentação Técnica
site_description: Sistema de Gestão de Pesquisa Legislativa com IA
site_author: Baniwa
docs_dir: docs
site_dir: site

theme:
  name: material
  language: pt
  palette:
    - scheme: default
      primary: custom
      accent: custom
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/senado.css

nav:
  - Início: index.md
  - O Projeto:
      - Apresentação e Motivação: projeto/apresentacao.md
      - Domínio Legislativo: projeto/dominio-legislativo.md
      - Callista 1.0 — Referência de UI: projeto/callista1-referencia-ui.md
  - Arquitetura:
      - Visão Geral das Camadas: architecture/overview.md
      - Fluxo de Dados: architecture/data-flow.md
      - Modelagem do Domínio: architecture/modelagem.md
      - Máquina de Estados: architecture/maquina-estados.md
      - Algoritmo de Sorteio Justo: architecture/sorteio-justo.md
      - Adapters Django ORM: architecture/adapters-orm.md
      - Adapter de Inteligência Artificial: architecture/adapter-ia.md
      - Adapter da API do Senado Federal: architecture/adapter-senado.md
      - Migração do Callista 1.0: architecture/migracao-callista1.md
      - API do Senado Federal — Análise: architecture/senado-api.md
  - Decisões (ADR):
      - ADR-001 · Clean Architecture: adr/ADR-001-clean-architecture.md
  - Guia do Desenvolvedor:
      - Configuração do Ambiente: desenvolvimento/ambiente.md
      - Convenções de Teste: desenvolvimento/testes.md
  - API: api/endpoints.md
  - Perspectivas:
      - Clean Architecture em Sistemas Públicos: perspectivas/por-que-clean-architecture-em-sistemas-governamentais.md
      - O domínio não se importa com o banco de dados: perspectivas/dominio-nao-se-importa-com-banco.md
      - A IA é só mais um detalhe de infraestrutura: perspectivas/ia-como-detalhe.md
      - O governo já tem a API. Você só precisa conectar.: perspectivas/api-senado-como-adapter.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true
  - tables
  - attr_list
